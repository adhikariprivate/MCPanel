site_name: MCPN — My Control Panel
site_description: Documentation for MCPN (My Control Panel)
repo_url: https://github.com/adhikariprivate/MCPanel
repo_name: adhikariprivate/MCPanel
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Introduction: getting-started/introduction.md
      - Installation: getting-started/installation.md
      - First-run setup: getting-started/first-run-setup.md
      - Signing in: getting-started/signing-in.md
      - Changelog: changelog.md
  - Websites:
      - Overview: websites/index.md
      - Adding a website: websites/adding-a-website.md
      - Overview tab: websites/overview-tab.md
      - Files: websites/files.md
      - SSH / SFTP: websites/ssh-sftp.md
      - Databases: websites/databases.md
      - Backups: websites/backups.md
      - SSL: websites/ssl.md
      - Custom vHost: websites/custom-vhost.md
      - Cron: websites/cron.md
      - Background services: websites/background-services.md
      - Logs: websites/logs.md
      - Terminal: websites/terminal.md
      - WordPress: websites/wordpress.md
      - Compiled binaries: binary-apps.md
      - mise apps: mise-sites.md
  - Email:
      - Email: email/index.md
      - Webmail: email/webmail.md
      - DNS via Cloudflare: email/dns-cloudflare.md
  - Monitoring:
      - Server monitoring: monitoring/server-monitoring.md
      - Telegram alerts: monitoring/telegram-alerts.md
      - Activity log: monitoring/activity-log.md
  - Firewall: firewall.md
  - Services: services.md
  - Security: security.md
  - Account settings: account-settings.md
  - Users and site access: users-and-access.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
